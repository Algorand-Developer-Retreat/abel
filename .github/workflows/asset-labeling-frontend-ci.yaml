name: Validate asset_labeling-frontend

on:
  
  workflow_call:
  

jobs:
  validate:
    runs-on: 'ubuntu-latest'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install algokit
        run: pipx install algokit

      # Single install at the repo root covers every project in the pnpm workspace
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate .env from template
        run: algokit project bootstrap env --ci
        working-directory: projects/asset_labeling-frontend

      
      - name: Run linters
        run: algokit project run lint --project-name 'asset_labeling-frontend'
      
      
      - name: Run unit tests
        run: algokit project run test --project-name 'asset_labeling-frontend'
      

      - name: Build
        run: algokit project run build --project-name 'asset_labeling-frontend'

name: Release asset_labeling-contracts

on:
  workflow_call:

jobs:
  deploy-testnet:
    runs-on: "ubuntu-latest"
    
    environment: contract-testnet
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install poetry
        run: | 
          pipx install poetry
          pipx inject poetry poetry-plugin-export

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install algokit
        run: pipx install algokit

      # Single install at the repo root covers every project in the pnpm workspace
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap Python dependencies
        run: algokit project bootstrap poetry
        working-directory: projects/asset_labeling-contracts

      - name: Configure git
        shell: bash
        run: |
          # set git user and email as test invoke git
          git config --global user.email "actions@github.com" && git config --global user.name "github-actions"

      - name: Deploy to testnet
        run: algokit project deploy testnet --project-name 'asset_labeling-contracts'
        env:
          # This is the account that becomes the creator of the contract
          DEPLOYER_MNEMONIC: ${{ secrets.DEPLOYER_MNEMONIC }}
          # The dispenser account is used to ensure the deployer account is funded
          DISPENSER_MNEMONIC: ${{ secrets.DISPENSER_MNEMONIC }}

name: Release asset_labeling-frontend

on:
  workflow_call:
permissions:
  contents: read
  packages: read

jobs:

  build:
    runs-on: ubuntu-latest
    name: Build asset_labeling-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install algokit
        run: pipx install algokit

      # Single install at the repo root covers every project in the pnpm workspace
      - name: Bootstrap dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate .env from template
        run: algokit project bootstrap env --ci
        working-directory: projects/asset_labeling-frontend

      - name: Build
        run: algokit project run build --project-name 'asset_labeling-frontend'

name: Validate asset_labeling-contracts

on:
  workflow_call:

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install poetry
        run: |
          pipx install poetry
          pipx inject poetry poetry-plugin-export

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install algokit
        run: pipx install algokit

      - name: Start LocalNet
        run: algokit localnet start

      # Single install at the repo root covers every project in the pnpm workspace
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap Python dependencies
        run: algokit project bootstrap poetry
        working-directory: projects/asset_labeling-contracts

      - name: Configure git
        shell: bash
        run: |
          # set git user and email as test invoke git
          git config --global user.email "actions@github.com" && git config --global user.name "github-actions"

      - name: Audit python dependencies
        run: algokit project run audit --project-name 'asset_labeling-contracts'

      - name: Lint and format python dependencies
        run: algokit project run lint --project-name 'asset_labeling-contracts'

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          algokit project run test --project-name 'asset_labeling-contracts'

      - name: Build smart contracts
        run: algokit project run build --project-name 'asset_labeling-contracts'

      - name: Scan TEAL files for issues
        run: algokit project run audit-teal --project-name 'asset_labeling-contracts'

      # Verifies the committed smart_contracts/artifacts match what the build above
      # just produced. If this fails, rebuild locally and commit the artifacts.
      - name: Check output stability of the smart contracts
        run: algokit project run ci-teal-diff --project-name 'asset_labeling-contracts'

      - name: Run deployer against LocalNet
        run: algokit project deploy localnet --project-name 'asset_labeling-contracts'
